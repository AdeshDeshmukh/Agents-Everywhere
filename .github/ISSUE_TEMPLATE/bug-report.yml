name: Bug report
description: Something in the engine, runner or control plane does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Describe a reproducible problem. Remove API keys, admin tokens, install-command credentials and private data from logs and screenshots. Report suspected permission bypasses or other vulnerabilities privately through [SECURITY.md](https://github.com/codity-ai/Agents-Everywhere/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did and what happened instead.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen with the same setup?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest commands or configuration that reproduce the problem, with all credentials removed.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Engine (CLI, TUI, serve)
        - Runner (install command, harness)
        - Control plane (API or web UI)
        - Client, SDK or plugin
        - Installation, build or CI
        - Not sure
    validations:
      required: true
  - type: input
    id: agents-everywhere-version
    attributes:
      label: Version
      description: Output of `agents-everywhere --version`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the OS version and architecture, such as Ubuntu 24.04 x64 or macOS arm64.
    validations:
      required: true
  - type: input
    id: runtimes
    attributes:
      label: Bun and Node.js versions
      description: Output of bun --version and node --version, if available.
  - type: dropdown
    id: environment
    attributes:
      label: Where the agent runs
      options:
        - Local laptop or workstation
        - AWS EC2 instance
        - Other VM or server
        - Container or Kubernetes pod
        - CI runner
        - Other or not applicable
  - type: input
    id: model
    attributes:
      label: Model provider and model
      description: Include the provider and model name if relevant. Never include the API key or an authenticated endpoint URL.
  - type: dropdown
    id: permission-mode
    attributes:
      label: Permission mode
      options:
        - Strict
        - Ask me
        - Not applicable or not sure
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: If relevant, include sanitized path and command grants, rejection YAML, and whether Use global config is enabled. Describe whether the runner and control plane are on different machines. Use sample paths and remove credentials, hostnames and private addresses. Report a suspected permission bypass privately instead.
      render: yaml
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: For web UI problems, include your browser and version instead.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant output. Remove API keys, tokens, install commands and private transcript content.
      render: text
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private data from this report and its attachments.
          required: true
